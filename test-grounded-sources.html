<!DOCTYPE html>
<html>
<head>
    <title>AI Grounded Sources Test</title>
    <script>
        async function testAIWithGroundedSources() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing AI content generation with grounded sources...</p>';
            
            try {
                const response = await fetch('http://localhost:3001/api/ai-content/generate-field', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        productName: 'MacBook Air M3',
                        brand: 'Apple',
                        country: 'Singapore',
                        fieldName: 'description',
                        fieldInstructions: 'Generate a product description'
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    resultDiv.innerHTML = `
                        <h3>✅ AI Content Generated Successfully</h3>
                        <p><strong>Content:</strong> ${result.content}</p>
                        <p><strong>Grounded Sources Count:</strong> ${result.grounded_sources?.length || 0}</p>
                        
                        ${result.grounded_sources && result.grounded_sources.length > 0 ? `
                            <h4>🔗 Grounded Sources:</h4>
                            <ul>
                                ${result.grounded_sources.map((source, index) => `
                                    <li>
                                        <strong>${source.title}</strong> (${source.type})
                                        <br>
                                        <a href="${source.url}" target="_blank" style="font-size: 0.8em; color: #666;">
                                            ${source.url.substring(0, 80)}...
                                        </a>
                                    </li>
                                `).join('')}
                            </ul>
                        ` : '<p>⚠️ No grounded sources found</p>'}
                        
                        <h4>📊 Full Response:</h4>
                        <pre style="background: #f5f5f5; padding: 10px; overflow-x: auto; font-size: 0.8em;">
                            ${JSON.stringify(result, null, 2)}
                        </pre>
                    `;
                } else {
                    resultDiv.innerHTML = `<p>❌ Error: ${result.error}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p>❌ Network Error: ${error.message}</p>`;
            }
        }
    </script>
</head>
<body>
    <h1>🤖 AI Grounded Sources Test</h1>
    <button onclick="testAIWithGroundedSources()">Test AI Content Generation</button>
    <div id="result"></div>
</body>
</html>
