apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: merch-manager-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu-limit: "2"
        run.googleapis.com/memory-limit: "2Gi"
        run.googleapis.com/timeout: "300"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 100
      serviceAccountName: YOUR_SERVICE_ACCOUNT@YOUR_PROJECT_ID.iam.gserviceaccount.com
      containers:
      - image: REGION-docker.pkg.dev/YOUR_PROJECT_ID/merch-manager/backend:latest
        ports:
        - containerPort: 8080
        env:
        # Application Environment
        - name: NODE_ENV
          value: "production"
        - name: APP_NAME
          value: "merch-manager-backend"
        - name: APP_VERSION
          value: "1.0.0"
        
        # Google Cloud Configuration
        - name: GOOGLE_CLOUD_PROJECT_ID
          value: "YOUR_PROJECT_ID"
        - name: GOOGLE_CLOUD_REGION
          value: "us-central1"
        # Note: GOOGLE_APPLICATION_CREDENTIALS removed to use Cloud Run service account
        
        # Google Merchant Center Configuration
        - name: GOOGLE_MERCHANT_ID
          value: "YOUR_MERCHANT_ID"
        - name: MERCHANT_API_BASE_URL
          value: "https://merchantapi.googleapis.com"
        - name: MERCHANT_API_VERSION
          value: "v1beta"
        - name: REQUIRED_SCOPES
          value: "https://www.googleapis.com/auth/content"
        
        # Google Gemini AI Configuration
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api-key
              key: "1"
        - name: GEMINI_MODEL
          value: "gemini-2.0-flash-exp"
        - name: GEMINI_TIMEOUT
          value: "30000"
        
        # CORS Configuration
        - name: CORS_ORIGIN
          value: "https://YOUR_FRONTEND_URL"
        - name: CORS_CREDENTIALS
          value: "true"
        
        # OAuth Configuration
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: google-oauth-client-id
              key: "latest"
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: google-oauth-client-secret
              key: "latest"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: "latest"
        - name: GOOGLE_REDIRECT_URI
          value: "https://YOUR_BACKEND_URL/auth/google/callback"
        - name: FRONTEND_URL
          value: "https://YOUR_FRONTEND_URL"
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: session-secret
              key: "latest"
        
        # Server Configuration
        - name: HOST
          value: "0.0.0.0"
        - name: REQUEST_TIMEOUT
          value: "120000"
        - name: REQUEST_SIZE_LIMIT
          value: "10mb"
        
        # Logging Configuration
        - name: LOG_LEVEL
          value: "info"
        - name: LOG_FORMAT
          value: "combined"
        - name: ENABLE_REQUEST_LOGGING
          value: "true"
        - name: ENABLE_ERROR_LOGGING
          value: "true"
        
        # Security Configuration
        - name: HELMET_ENABLED
          value: "true"
        - name: COMPRESSION_ENABLED
          value: "true"
        - name: RATE_LIMIT_ENABLED
          value: "true"
        - name: RATE_LIMIT_WINDOW_MS
          value: "900000"
        - name: RATE_LIMIT_MAX_REQUESTS
          value: "100"
        
        # Feature Flags
        - name: DEMO_MODE
          value: "false"
        - name: AI_CONTENT_ENABLED
          value: "true"
        - name: COMPETITIVE_PRICING_ENABLED
          value: "true"
        - name: REVIEWS_ENABLED
          value: "true"
        - name: ANALYTICS_ENABLED
          value: "true"
        
        # Performance Configuration
        - name: MAX_CONCURRENT_REQUESTS
          value: "100"
        - name: PYTHON_SCRIPT_TIMEOUT
          value: "45000"
        - name: CACHE_TTL
          value: "3600"
        
        # Health Check Configuration
        - name: HEALTH_CHECK_ENABLED
          value: "true"
        - name: READINESS_CHECK_ENABLED
          value: "true"
        
        # Development/Debug Configuration
        - name: DEBUG_MODE
          value: "false"
        - name: VERBOSE_LOGGING
          value: "false"
        - name: ENABLE_STACK_TRACES
          value: "false"
        
        # External Service Configuration
        - name: PYTHON_EXECUTABLE
          value: "python3"
        - name: AI_CONTENT_SCRIPT_PATH
          value: "./src/scripts/ai_content_generator.py"
        - name: COMPETITIVE_PRICING_SCRIPT_PATH
          value: "./src/scripts/competitive_pricing_analyzer.py"
        
        # Note: Volume mounts and secrets removed - using Cloud Run service account authentication
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
          requests:
            cpu: "1"
            memory: "1Gi"
      # Note: Volumes removed - using Cloud Run service account authentication
